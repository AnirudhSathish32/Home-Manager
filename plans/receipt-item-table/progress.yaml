        orchestrator_check: "reproduced: tax_basis gives [100, -100, 200]"
        status: fixed in SL-05 (7255210)
    verified_by_reviewer: "10,000 generated quantity strings and 52 edge cases, no exception; Ledger.record reads leave the database unchanged"

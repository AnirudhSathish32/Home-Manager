    notes: >-
      enqueue(receipt_kind={segment, first_line_id, kind}) puts it in config_json only when given. run() pops it, and
      requested_kinds() (after the part classification loop, before read) matches it to the part starting at that
      line, else fails the run "The file's split changed; confirm the split, then change the kind again."; every other
      part takes the user's latest receipt_kind correction (Ledger.chosen_kind, null = none). read() passes the kind
      on; record()/publish() carry kind_change into source. publish_receipt writes the receipt_kind correction (previous
      = the kind before) in its own transaction, and for a user-reviewed receipt sets the kind and
      pending_details_json {kind, details, run_id, proposed_at} without touching amounts, items or review state; a
      written publish clears pending. Ledger.apply_details (field receipt_details, value kind, previous the earlier
      details JSON; no refresh_paid). undo_corrections: receipt_kind inserts an undo row with the earlier kind, sets it
      and drops pending (then refresh_paid, as PAID_FIELDS includes receipt_kind); receipt_details moves the details
      back to pending and records an undo row (value null; undoing that row is refused: apply again instead). History
      labels "Receipt kind" and "Receipt details". Manager.change_receipt_kind under the mutex with require(False): 400
      unknown receipt or bill, 409 "A reading is in progress; try again when it finishes" for a queued/running
      extraction or parse of the same blob, unchanged no-op, first line from document_segments (400 "This receipt is no
      longer in the file's split." when the file is split but this part isn't), else the parse's first line with text;
      submitted on the inference queue without a busy check. API: PATCH /api/receipts/{id}/kind (Literal kind -> 422
      for others; 202 with run_id or 200 unchanged), POST /api/receipts/{id}/details/apply. correct() still refuses
      receipt_kind (it isn't in CORRECTABLE). J-c simulated by a queued kind-change row set to running, then a restart.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "home-manager"
version = "0.1.0"
description = "Local, read-only document inventory and immutable capture"
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.141.1", "uvicorn==0.53.0", "pydantic==2.13.5",
  "pillow==12.3.0", "zxing-cpp==3.1.1",
  "numpy==2.5.3", "pypdfium2==5.13.0",
  # Encrypted .hmshare files: AES-256-GCM and scrypt.
  "cryptography==46.0.3",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "httpx==0.28.1"]
browser-test = ["playwright==1.63.0"]
# In-process advisory checks. Weights: `home-manager --install-laya` (pinned revision, one download).
laya = ["laya==0.3.20"]

[project.scripts]
home-manager = "home_manager.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
home_manager = ["static/*", "migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

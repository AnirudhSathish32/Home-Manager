[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "home-manager"
version = "0.1.0"
description = "Local, read-only document inventory and immutable capture"
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.141.1", "uvicorn==0.53.0", "pydantic==2.13.5",
  "pillow==12.3.0", "zxing-cpp==3.1.1",
  "numpy==2.5.3", "pypdfium2==5.13.0",
  # Encrypted .hmshare files: AES-256-GCM and scrypt.
  "cryptography==46.0.3",
  # The year-end CPA pack workbook (finance/cpa_pack.py). Writes values only; no formulas are evaluated.
  "openpyxl==3.1.5",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "httpx==0.28.1"]
browser-test = ["playwright==1.63.0"]
# Engine 2, the second tax engine (finance/engines/taxcalc.py; docs/taxes.md "The tax engines"): public domain (CC0).
engine2 = ["taxcalc==6.8.4"]
# Checks: `ruff check src tests`, `mypy`, `pytest --cov`.
dev = ["pytest-cov==7.1.0", "ruff==0.16.9", "mypy==2.3.1"]

[project.scripts]
home-manager = "home_manager.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"home_manager.app" = ["static/*", "static/fonts/*"]
"home_manager.library" = ["migrations/*.sql"]
# The pinned OpenTax engine (docs/taxes.md "The tax engines"): unmodified from npm, run as a separate Node process.
"home_manager" = ["vendor/NOTICES.md", "vendor/opentax/*"]
# Engine 2's worksheet map (docs/taxes.md "The tax engines"): how its outputs relate, checked against each run.
"home_manager.finance.engines" = ["taxcalc_map.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]  # "." for the eval suite (evals/), tested on synthetic data only.
addopts = "-ra"

[tool.coverage.run]
source = ["home_manager"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 160
target-version = "py313"
src = ["src", "tests", "."]

[tool.ruff.lint]
# Likely bugs (pyflakes, bugbear, syntax errors), current-Python idioms and import order. No formatter.
select = ["E9", "F", "B", "W6", "UP", "I"]
# timezone.utc is the house spelling; zip(strict=True) would turn uneven inputs into errors (a behavior change).
ignore = ["UP017", "B905"]

[tool.ruff.lint.per-file-ignores]
# FastAPI declares parameters with Query(...) defaults.
"src/home_manager/app/api.py" = ["B008"]
# Fixtures imported from other test modules are "redefined" by each test that requests them.
"tests/*" = ["F811"]

[tool.ruff.lint.isort]
# Imports are ordered by module name, `import x` and `from x import y` together.
force-sort-within-sections = true

[tool.mypy]
python_version = "3.13"
files = ["src/home_manager/core", "src/home_manager/finance", "src/home_manager/library"]
ignore_missing_imports = true
check_untyped_defs = false
